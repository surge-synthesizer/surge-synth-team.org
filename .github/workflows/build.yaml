on:
  workflow_dispatch:
    inputs:
      notify_discord:
        description: "Also post the report summary to Discord"
        type: boolean
        default: false
  workflow_call:
  push:
    branches: [master]
  schedule:
    # Daily at 12:00 UTC, to refresh /reports/surge-repo-activity and announce it.
    - cron: "0 12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-slim
    outputs:
      report_ok: ${{ steps.report.outputs.ok }}
      discord_payload: ${{ steps.report.outputs.discord_payload }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: "package.json"
          cache: "pnpm"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pnpm install
      - id: pages
        uses: actions/configure-pages@v5
      # Regenerates public/reports/* in the working tree before the build, so
      # the deployed report is current and nothing is committed by CI. On
      # failure the build still ships the last committed copy, which carries
      # its own "Generated ..." timestamp rather than looking fresh.
      - id: report
        name: Generate the surge repo activity report
        continue-on-error: true
        env:
          # The built-in GITHUB_TOKEN is scoped to this repo, so it cannot read
          # the org's Dependabot alerts; that section degrades to "not
          # available". Set DEPENDABOT_READ_TOKEN (a PAT with security read on
          # the org) to populate it.
          GITHUB_TOKEN: ${{ secrets.DEPENDABOT_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/surge_report.py \
            --publish-dir . \
            --public-only \
            --out "$RUNNER_TEMP/report" \
            --summary-json "$RUNNER_TEMP/summary.json" \
            --discord-payload "$RUNNER_TEMP/discord.json" \
            --report-url "https://surge-synth-team.org/reports/surge-repo-activity/"
          # The payload is a single line of JSON, so it survives a job output
          # verbatim and the deploy job can curl it without rebuilding it.
          # printf, not echo: the JSON contains a \n escape before the link and
          # some shells' echo would expand it into a real newline, which would
          # both corrupt the JSON and break GITHUB_OUTPUT's key=value parsing.
          {
            printf 'ok=true\n'
            printf 'discord_payload=%s\n' "$(cat "$RUNNER_TEMP/discord.json")"
          } >> "$GITHUB_OUTPUT"
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Announce only on the daily run (or an explicit dispatch), so ordinary
      # pushes to master do not spam the channel.
      - name: Announce the report on Discord
        if: >-
          needs.build.outputs.report_ok == 'true' &&
          (github.event_name == 'schedule' ||
          github.event.inputs.notify_discord == 'true')
        env:
          WEBHOOK: ${{ secrets.DISCORD_REPO_REPORTS_WEBHOOK }}
          PAYLOAD: ${{ needs.build.outputs.discord_payload }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_REPO_REPORTS_WEBHOOK is not set; skipping the post"
            exit 0
          fi

          # Built by surge_report.py so the message text lives in one testable
          # place rather than being assembled from shell.
          printf '%s' "$PAYLOAD" > payload.json
          cat payload.json

          # --fail-with-body exits non-zero on 4xx/5xx but still prints what
          # Discord said. curl sends its own User-Agent; urllib's default one
          # is refused by Cloudflare with a 403 (error 1010).
          curl --fail-with-body -sS -X POST \
            -H "Content-Type: application/json" \
            --data @payload.json \
            -w '\ndiscord: HTTP %{http_code}\n' \
            "$WEBHOOK"
